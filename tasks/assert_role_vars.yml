---
- name: Assert list parameters are of type list
  ansible.builtin.assert:
    that:
      - tlog_users_sssd is sequence
      - tlog_users_sssd is not string
      - tlog_users_sssd is not mapping
      - tlog_groups_sssd is sequence
      - tlog_groups_sssd is not string
      - tlog_groups_sssd is not mapping
      - tlog_exclude_users_sssd is sequence
      - tlog_exclude_users_sssd is not string
      - tlog_exclude_users_sssd is not mapping
      - tlog_exclude_groups_sssd is sequence
      - tlog_exclude_groups_sssd is not string
      - tlog_exclude_groups_sssd is not mapping
    fail_msg: >-
      List parameters must be of type list. Found:
      tlog_users_sssd={{ tlog_users_sssd | type_debug }},
      tlog_groups_sssd={{ tlog_groups_sssd | type_debug }},
      tlog_exclude_users_sssd={{ tlog_exclude_users_sssd | type_debug }},
      tlog_exclude_groups_sssd={{ tlog_exclude_groups_sssd | type_debug }}

- name: Assert users or groups are specified when scope is some
  ansible.builtin.assert:
    that:
      - >-
        (tlog_users_sssd | length > 0)
        or (tlog_groups_sssd | length > 0)
    fail_msg: >-
      tlog_scope_sssd is 'some' but neither tlog_users_sssd nor
      tlog_groups_sssd contains any entries - no sessions will be
      recorded
  when: tlog_scope_sssd == 'some'

- name: Assert exclude lists are not set when scope is not all
  ansible.builtin.assert:
    that:
      - tlog_exclude_users_sssd | length == 0
      - tlog_exclude_groups_sssd | length == 0
    fail_msg: >-
      tlog_exclude_users_sssd and tlog_exclude_groups_sssd are only
      applicable when tlog_scope_sssd is 'all', got
      tlog_scope_sssd='{{ tlog_scope_sssd }}'
  when: tlog_scope_sssd != 'all'
